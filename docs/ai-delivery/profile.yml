schemaVersion: 1

project:
  repository: sniffy/sniffy
  baseBranch: develop
  githubProject:
    organization: sniffy
    number: 2

controlPlane:
  protocol: delivery-control/v1
  documentation: docs/ai-delivery/control-plane.md
  controlIssueTitlePrefix: "AI Delivery Control Log"
  controlIssueLabel: "ai-delivery-control"
  rotateAfterCommands: 500
  rotateAfterDays: 30

statusSnapshot:
  protocol: ai-delivery-status/v1
  documentation: docs/ai-delivery/status-snapshot.md
  chatgptInstructions: .chatgpt/status-snapshot-instructions.md
  workflow: .github/workflows/delivery-status.yml
  issueTitle: "AI Delivery Status — Project 2"
  issueLabel: "ai-delivery-status"
  artifactName: "ai-delivery-status-project-2"
  snapshotFile: "project-2-status.json"
  rawFieldsFile: "project-fields.raw.json"
  rawItemsFile: "project-items.raw.json"
  rawIssuesFile: "repository-issues.raw.json"
  rawPullRequestsFile: "repository-pull-requests.raw.json"
  maxAgeMinutes: 30
  retentionDays: 2
  scheduleMinutes: [5]
  refreshCommand: "/ai-delivery-status refresh"
  refreshActors: [bedrin, bedrin-gpt]
  refreshTimeoutSeconds: 120

fields:
  status: Status
  execution: Execution
  # Optional. An empty value means no implementation executor has been deliberately selected.
  implementer: Implementer
  verifier: Verifier
  executor: Executor
  workerReference: Worker reference

executors:
  ChatGPT:
    assignee: bedrin-gpt
    model: provider-managed
  Codex Cloud:
    assignee: bedrin-codex-cloud
    model: provider-managed
  Local Codex:
    assignee: bedrin-codex-local
    model: Sol
    reasoning: extra-high
    # App-native dispatch derives this scheduling limit from the retained Project snapshot.
    # Provider-wide Codex project/task inventory is recovery evidence, not a normal capacity source.
    maxConcurrentWorkers: 1
  Human:
    assignee: bedrin

routing:
  supervisor: ChatGPT
  defaultReviewer: ChatGPT
  implementation:
    directChatGPTWhenCapable: true
    firstExternalExecutorForBoundedFreshWork: Codex Cloud
    complexOrPersistentExecutor: Local Codex
    existingPullRequestContinuationExecutor: Local Codex
  convergence:
    checkpointTrigger: corrected-work-returns-to-review-with-substantive-blockers
    doNotAutoDispatchAnotherPatchRound: true
    preferredEscalationExecutor: Local Codex
  mergeExecutor: Human

intake:
  pullRequests:
    enabled: true
    repository: sniffy/sniffy
    baseBranch: develop
    includeDraftsInReview: false
    # PR authorship is provenance, not a routing decision. Leave Implementer empty during intake.
    setImplementerFromAuthor: false
    initialReviewer: ChatGPT
    defaultVerifier: ChatGPT
    canonicalization:
      exactlyOneClosingIssue: issue
      noClosingIssue: pullRequest
      multipleClosingIssues: pullRequestPlanning
  dependabot:
    enabled: true
    projectAutoAddFilter: "is:pr is:open label:dependencies"
    backfillExisting: true
    # Dependabot is a specialization of universal PR intake, not a separate lifecycle entry.
    reviewer: ChatGPT
    # Project 2 currently contains a Dependabot Implementer option for manual/backward-compatible classification,
    # but automated intake deliberately does not select it.

branches:
  newWorkPrefix: agent/
