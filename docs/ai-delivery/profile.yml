schemaVersion: 2

project:
  repository: sniffy/sniffy
  baseBranch: develop
  githubProject:
    organization: sniffy
    number: 2

runtime:
  contract: docs/ai-delivery/runtime-contract.md
  instructionAudit: docs/ai-delivery/instruction-audit.md
  # Detailed policy is loaded after selection, not as a recurring dispatcher prefix.
  dispatcherLoadsDetailedPolicy: false
  oneCandidatePerTick: true

controlPlane:
  protocol: delivery-control/v1
  documentation: docs/ai-delivery/control-plane.md
  controlIssueTitlePrefix: "AI Delivery Control Log"
  controlIssueLabel: "ai-delivery-control"
  rotateAfterCommands: 500
  rotateAfterDays: 30

statusSnapshot:
  protocol: ai-delivery-status/v1
  documentation: docs/ai-delivery/status-snapshot.md
  chatgptInstructions: .chatgpt/status-snapshot-instructions.md
  workflow: .github/workflows/delivery-status.yml
  issueTitle: "AI Delivery Status — Project 2"
  issueLabel: "ai-delivery-status"
  artifactName: "ai-delivery-status-project-2"
  snapshotFile: "project-2-status.json"
  rawFieldsFile: "project-fields.raw.json"
  rawItemsFile: "project-items.raw.json"
  rawIssuesFile: "repository-issues.raw.json"
  rawPullRequestsFile: "repository-pull-requests.raw.json"
  maxAgeMinutes: 30
  retentionDays: 2
  scheduleMinutes: [5]
  refreshCommand: "/ai-delivery-status refresh"
  refreshActors: [bedrin, bedrin-gpt]
  refreshTimeoutSeconds: 120
  dispatchProjection: true

fields:
  status: Status
  execution: Execution
  # Optional. An empty value means no implementation executor has been deliberately selected.
  implementer: Implementer
  verifier: Verifier
  executor: Executor
  workerReference: Worker reference

schedulers:
  ChatGPT:
    surface: Chat
    forbiddenSurface: Work
    budgetSlots: [0]
    fullCadenceSlots: [0, 15, 30, 45]
    prompt: .chatgpt/scheduled-task-prompt.md
  Local Codex:
    adapter: codex-app-same-thread-v1
    surface: Codex Automation
    prompt: .codex/local/scheduled-task-prompt.md
    lifecycleTemplate: .codex/local/worker-task-prompt.md
    snapshotHelper: .codex/local/project-queue-snapshot.sh

executors:
  ChatGPT:
    assignee: bedrin-gpt
    model: provider-managed
    reasoning: provider-managed
    dispatchMode: direct
  Codex Cloud:
    assignee: bedrin-codex-cloud
    model: provider-managed
    # Cloud has no Project polling loop. ChatGPT must claim and trigger each routed Cloud turn.
    dispatchMode: supervised
    dispatchOwner: ChatGPT
  Local Codex:
    assignee: bedrin-codex-local
    appNativeAdapter: codex-app-same-thread-v1
    appNativeModel: gpt-5.6-terra
    appNativeReasoning: medium
    workerModel: gpt-5.6-terra
    workerReasoning: medium
    escalationModel: gpt-5.6-sol
    escalationReasoning: high
    dispatchMode: polling
    # The app-native automation performs the lifecycle turn in its own persistent conversation.
    # No nested child thread/task/worktree is part of this adapter.
    appNativeSameThread: true
    maxConcurrentWorkers: 1
  Human:
    assignee: bedrin
    dispatchMode: directed

routing:
  supervisor: ChatGPT
  defaultReviewer: ChatGPT
  implementation:
    directChatGPTWhenCapable: true
    firstExternalExecutorForBoundedFreshWork: Codex Cloud
    complexOrPersistentExecutor: Local Codex
    existingPullRequestContinuationExecutor: Local Codex
  convergence:
    checkpointTrigger: corrected-work-returns-to-review-with-substantive-blockers
    doNotAutoDispatchAnotherPatchRound: true
    preferredEscalationExecutor: Local Codex
  mergeExecutor: Human

supervision:
  mode: lease-based-stale-recovery
  schedulerChecksOnlyExpiredOrInvalidLease: true
  workerMayRenewBeforeExpiry: true
  leaseMinutes:
    ChatGPT: 60
    Codex Cloud: 120
    Local Codex: 240
    externalOperation: 60
    provisionalDispatch: 30

telemetry:
  required: true
  fields:
    - startedAt
    - finishedAt
    - durationSeconds
    - adapter
    - scheduler
    - model
    - reasoning
    - snapshotRunId
    - selectedCandidate
    - outcome
    - usageSource
    - inputTokens
    - cachedInputTokens
    - outputTokens
    - reasoningTokens
  unavailableTokenValue: null
  forbidFabricatedExactUsage: true

intake:
  pullRequests:
    enabled: true
    repository: sniffy/sniffy
    baseBranch: develop
    includeDraftsInReview: false
    # PR authorship is provenance, not a routing decision. Leave Implementer empty during intake.
    setImplementerFromAuthor: false
    initialReviewer: ChatGPT
    defaultVerifier: ChatGPT
    canonicalization:
      exactlyOneClosingIssue: issue
      noClosingIssue: pullRequest
      multipleClosingIssues: pullRequestPlanning
  dependabot:
    enabled: true
    projectAutoAddFilter: "is:pr is:open label:dependencies"
    backfillExisting: true
    # Dependabot is a specialization of universal PR intake, not a separate lifecycle entry.
    reviewer: ChatGPT
    # Project 2 currently contains a Dependabot Implementer option for manual/backward-compatible classification,
    # but automated intake deliberately does not select it.

branches:
  newWorkPrefix: agent/
