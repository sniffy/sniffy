name: Autonomous implementation task
description: A task refined enough for Codex Cloud or unattended local Codex execution
title: ""
body:
  - type: markdown
    attributes:
      value: |
        Complete every relevant section. The issue should contain enough information for an agent to implement and test the change without an interactive clarification round.
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable user or developer behavior after the task is complete.
      placeholder: What should work, for whom, and why?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and current behavior
      description: Include relevant modules, APIs, links, prior attempts, errors, and constraints.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: State the decisions already made. Avoid leaving product choices to the implementation agent.
      placeholder: |
        - Requirement 1
        - Requirement 2
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: Explicitly exclude tempting adjacent work.
  - type: textarea
    id: risk_proof
    attributes:
      label: Risk, architecture, and proof matrix
      description: For each requirement or high-risk lifecycle/compatibility case, state the module/API boundary and the exact test, CI job, or inspection that will prove it. Mark non-applicable risk axes explicitly.
      placeholder: |
        | Requirement or risk | Allowed module/API boundary | Proof |
        | --- | --- | --- |
        | Java 8 production artifact | production module only; no newer APIs | focused Java 8 test + bytecode contract |
        | partial setup failure | no global/core redesign | named launcher test proving body did not run and cleanup completed |
    validations:
      required: true
  - type: textarea
    id: standard_tooling
    attributes:
      label: Standard tooling and infrastructure rationale
      description: Evaluate maintained tools and declarative composition first. Write "Not applicable - no shared infrastructure change" when appropriate.
      placeholder: |
        For bespoke infrastructure, record the maintainer-approved:
        1. Exact requirement and observable gap
        2. Maintained alternatives evaluated and why composition is insufficient
        3. Smallest custom surface and maintenance owner
        4. Security/permissions model and deterministic tests
        5. Upgrade/compatibility strategy and failure/noise semantics
        6. Removal condition and migration plan

        For a new workflow or materially new job, also record why an existing job cannot host it, triggers, least privilege, required-check behavior, maintainer response, lifecycle, and overlap with platform signals.
    validations:
      required: true
  - type: textarea
    id: delivery
    attributes:
      label: Delivery topology and checkpoints
      description: State base/head branches, whether an existing PR must be reused, who creates the PR, draft/ready rules, publication proof, and any internal implementation checkpoints. Use one PR unless slices are independently mergeable.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use verifiable checkboxes.
      placeholder: |
        - [ ] Behavior is covered by tests
        - [ ] Compatibility requirements are preserved
        - [ ] Documentation is updated
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Required validation
      description: List focused tests, full build commands, JDKs, platforms, or manual checks.
    validations:
      required: true
  - type: dropdown
    id: execution
    attributes:
      label: Proposed execution route
      description: The delivery lead may change this during refinement.
      options:
        - Codex Cloud
        - Unattended local Codex in an isolated VM/container
        - Human-led implementation
    validations:
      required: true
  - type: checkboxes
    id: readiness
    attributes:
      label: Autonomous readiness
      options:
        - label: Product and compatibility decisions are explicit.
          required: true
        - label: Module/API scope boundaries and any global-state or lifecycle decisions are explicit.
          required: true
        - label: Every acceptance criterion is mapped to an executable or inspectable proof.
          required: true
        - label: Maintained alternatives were assessed; bespoke infrastructure or new CI topology has explicit maintainer approval.
          required: true
        - label: Acceptance criteria are testable.
          required: true
        - label: The agent may make ordinary implementation decisions without asking for approval.
          required: true
        - label: Required credentials, external services, and branch constraints are documented.
          required: true
