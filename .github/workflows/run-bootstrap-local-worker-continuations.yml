name: Run local worker continuation preparation

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'agent/local-worker-continuations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/local-worker-continuations
          fetch-depth: 0
      - name: Execute the one-shot preparation script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/bootstrap-local-worker-continuations.yml').read_text()
          marker = "      - name: Apply repository workflow and worker-prompt changes\n"
          start = workflow.index(marker) + len(marker)
          run_marker = "        run: |\n"
          start = workflow.index(run_marker, start) + len(run_marker)
          end = workflow.index("      - name: Commit and publish prepared changes\n", start)
          block = workflow[start:end]
          lines = block.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-local-worker-continuations.sh').write_text(script)
          PY
          bash /tmp/apply-local-worker-continuations.sh
          rm -f .github/workflows/bootstrap-local-worker-continuations.yml
          rm -f .github/workflows/run-bootstrap-local-worker-continuations.yml
          git diff --check
      - name: Upload prepared files
        uses: actions/upload-artifact@v7
        with:
          name: local-worker-continuation-prepared-files
          path: |
            docs/local-codex-worker.md
            .github/workflows/project-status.yml
            .github/workflows/project-field.yml
          if-no-files-found: error
