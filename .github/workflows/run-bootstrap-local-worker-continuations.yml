name: Run local worker continuation preparation

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'agent/local-worker-continuations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/local-worker-continuations
          fetch-depth: 0
      - name: Execute the one-shot preparation script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/bootstrap-local-worker-continuations.yml').read_text()
          marker = "      - name: Apply repository workflow and worker-prompt changes\n"
          start = workflow.index(marker) + len(marker)
          run_marker = "        run: |\n"
          start = workflow.index(run_marker, start) + len(run_marker)
          end = workflow.index("      - name: Commit and publish prepared changes\n", start)
          block = workflow[start:end]
          lines = block.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-local-worker-continuations.sh').write_text(script)
          PY
          bash /tmp/apply-local-worker-continuations.sh
          git diff --check -- docs/local-codex-worker.md
      - name: Commit and publish the worker prompt
        shell: bash
        run: |
          git config user.name 'Sniffy automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/local-codex-worker.md
          git commit -m 'Teach local worker to resume pull requests'
          git push origin HEAD:agent/local-worker-continuations
