name: Update project status

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: project-status-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  update-status:
    permissions:
      issues: write
      pull-requests: write
    if: >-
      (
        github.event.comment.user.login == 'bedrin' ||
        github.event.comment.user.login == 'bedrin-gpt' ||
        (
          vars.PRODUCT_MANAGER_LOGIN != '' &&
          github.event.comment.user.login == vars.PRODUCT_MANAGER_LOGIN
        )
      ) &&
      startsWith(github.event.comment.body, '/project-status ')
    runs-on: ubuntu-latest

    steps:
      - name: Update Sniffy Product & Delivery status
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const organization = 'sniffy';
            const projectNumber = 2;
            const commandPrefix = '/project-status ';
            const commandLine = context.payload.comment.body.split(/\r?\n/, 1)[0];
            const requestedStatus = commandLine
              .slice(commandPrefix.length)
              .trim();

            const allowedStatuses = [
              'Draft',
              'Planning',
              'Implementation',
              'Review',
              'Verification',
              'Approval',
              'Done'
            ];

            if (!allowedStatuses.includes(requestedStatus)) {
              core.setFailed(
                `Unknown status "${requestedStatus}". Allowed values: ${allowedStatuses.join(', ')}`
              );
              return;
            }

            const workItemNodeId = context.payload.issue.node_id;

            const result = await github.graphql(
              `query($organization: String!, $projectNumber: Int!, $workItemNodeId: ID!) {
                organization(login: $organization) {
                  projectV2(number: $projectNumber) {
                    id
                    field(name: "Status") {
                      ... on ProjectV2SingleSelectField {
                        id
                        options {
                          id
                          name
                        }
                      }
                    }
                  }
                }
                node(id: $workItemNodeId) {
                  ... on Issue {
                    projectItems(first: 50) {
                      nodes {
                        id
                        project {
                          id
                          number
                        }
                      }
                    }
                  }
                  ... on PullRequest {
                    projectItems(first: 50) {
                      nodes {
                        id
                        project {
                          id
                          number
                        }
                      }
                    }
                  }
                }
              }`,
              { organization, projectNumber, workItemNodeId }
            );

            const project = result.organization?.projectV2;
            if (!project) {
              core.setFailed(`Project ${organization}/${projectNumber} was not found or is not accessible.`);
              return;
            }

            const statusField = project.field;
            if (!statusField) {
              core.setFailed('The project does not contain a single-select field named Status.');
              return;
            }

            const statusOption = statusField.options.find(option => option.name === requestedStatus);
            if (!statusOption) {
              core.setFailed(`Status option "${requestedStatus}" does not exist in the project.`);
              return;
            }

            let projectItem = result.node?.projectItems?.nodes.find(
              item => item.project?.id === project.id
            );
            if (!projectItem) {
              const addItemResult = await github.graphql(
                `mutation($projectId: ID!, $workItemNodeId: ID!) {
                  addProjectV2ItemById(input: {
                    projectId: $projectId,
                    contentId: $workItemNodeId
                  }) { item { id } }
                }`,
                { projectId: project.id, workItemNodeId }
              );
              projectItem = addItemResult.addProjectV2ItemById.item;
              core.notice('Added this issue or pull request to Sniffy Product & Delivery.');
            }

            await github.graphql(
              `mutation(
                $projectId: ID!,
                $itemId: ID!,
                $fieldId: ID!,
                $optionId: String!
              ) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId,
                    itemId: $itemId,
                    fieldId: $fieldId,
                    value: { singleSelectOptionId: $optionId }
                  }
                ) {
                  projectV2Item { id }
                }
              }`,
              {
                projectId: project.id,
                itemId: projectItem.id,
                fieldId: statusField.id,
                optionId: statusOption.id
              }
            );

            core.notice(`Updated project status to "${requestedStatus}".`);

      - name: Acknowledge the command and preserve the audit trail
        if: ${{ success() }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            try {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: '+1'
              });
            } catch (error) {
              core.setFailed(`Status was updated, but the command could not be acknowledged: ${error.message}`);
            }
