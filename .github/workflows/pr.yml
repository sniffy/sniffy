name: Check Pull Request

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - master
      - release/*
      - hotfix/*
  pull_request:
    branches-ignore:
      - tag/*
env:
  MAVEN_OPTS: -Dkotlin.environment.keepalive=true
# TODO: somehow grab test results from the github action
jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-26.04
    env:
      HOME: /root
      PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright
    container:
      image: node:24-bookworm-slim@sha256:cb4e8f7c443347358b7875e717c29e27bf9befc8f5a26cf18af3c3dec80e58c5
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sniffy-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: sniffy-ui/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and Storybook interaction tests with coverage
        run: npm run test:coverage
      - name: Upload frontend coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./sniffy-ui/coverage/lcov.info
          flags: frontend
          disable_search: true
          name: frontend
      - name: Build Storybook
        run: npm run storybook:build
      - name: Build production assets
        run: npm run build
      - name: Verify generated assets
        run: npm run check:generated
      - name: Validate bundle
        run: npm run check:bundle
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Playwright end-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-browser-results
          path: |
            sniffy-ui/playwright-report/
            sniffy-ui/test-results/
  smoke-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 8
            os: ubuntu-26.04
            label: Ubuntu
          - java: 11
            os: windows-2025
            label: Windows
          - java: 17
            os: macos-26
            label: macOS
          - java: 25
            os: ubuntu-26.04
            label: Ubuntu
    name: Smoke JDK ${{ matrix.java }}, ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.8.6
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '.github/workflows/pr.yml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Resolve dependencies
        run: mvn -T 1C -B de.qaware.maven:go-offline-maven-plugin:resolve-dependencies -U -P ci || mvn -X -T 1C -B de.qaware.maven:go-offline-maven-plugin:resolve-dependencies -U -P ci
        if: matrix.os != 'windows-2025'
      - name: Resolve dependencies
        shell: cmd
        run: .\mvnretry.bat de.qaware.maven:go-offline-maven-plugin:resolve-dependencies -U -P ci
        if: matrix.os == 'windows-2025'
      - name: Build with Maven
        run: mvn -T 1C -B verify --file pom.xml -U -P ci -Dgpg.skip=true -Dmaven.wagon.http.retryHandler.count=3
        if: matrix.os != 'windows-2025'
        # https://youtrack.jetbrains.com/issue/KT-43894
        env:
          MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.showThreadName=true -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.showThreadName=true -Xmx1024m -Didea.home.path=${{ env.RUNNER_TEMP }} -Didea.ignore.disabled.plugins=true"
      - name: Build with Maven
        run: mvn -T 1C -B verify --file pom.xml -U -P ci '-Dgpg.skip=true' '-Dmaven.wagon.http.retryHandler.count=3'
        if: matrix.os == 'windows-2025'
        # https://youtrack.jetbrains.com/issue/KT-43894
        env:
          MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.showThreadName=true -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.showThreadName=true -Xmx1024m -Didea.home.path=${{ env.RUNNER_TEMP }} -Didea.ignore.disabled.plugins=true"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: surefire-test-report-smoke-test-${{ matrix.java }}-${{ matrix.os }}
          path: |
            **/target/surefire-reports/
            **/target/surefire-reports/*.dump
            **/target/surefire-reports/*.dumpstream
            **/target/surefire-reports-provider-lifecycle/
            **/target/surefire-reports-provider-lifecycle/*.dump
            **/target/surefire-reports-provider-lifecycle/*.dumpstream
            **/target/hs_err*.*
            **/target/*jstack*.txt
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: backend
  arch-matrix:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    needs:
      - smoke-test
    strategy:
      matrix:
        platform: [ linux/arm, linux/arm64, linux/s390x, linux/ppc64le ]
    name: Test with ${{ matrix.platform }} AdoptOpenJDK 11
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - name: Available platforms
        run: echo ${{ steps.qemu.outputs.platforms }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: 'temurin'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.8.6
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '.github/workflows/pr.yml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Resolve dependencies
        run: mvn de.qaware.maven:go-offline-maven-plugin:resolve-dependencies -U -P ci,qemu || mvn de.qaware.maven:go-offline-maven-plugin:resolve-dependencies -U -P ci,qemu
      - name: Build with Maven
        run: mvn -T 1C -B clean install --file pom.xml -U -P ci,qemu -Dgpg.skip=true -Dmaven.wagon.http.retryHandler.count=3
        # https://youtrack.jetbrains.com/issue/KT-43894
        env:
          MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.showThreadName=true -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.showThreadName=true -Xmx1024m -Didea.home.path=${{ env.RUNNER_TEMP }} -Didea.ignore.disabled.plugins=true"
      - name: Resolve dependencies for compatibility tests
        run: mvn -f sniffy-compatibility-tests/pom.xml de.qaware.maven:go-offline-maven-plugin:resolve-dependencies -U -P ci || mvn -f sniffy-compatibility-tests/pom.xml de.qaware.maven:go-offline-maven-plugin:resolve-dependencies -U -P ci
      - run: cp -R ~/.m2/repository ./repository
      - name: Build with ${{ matrix.platform }} AdoptOpenJDK 11
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.github/workflows/Dockerfile.3.8.1-adoptopenjdk-11
          platforms: ${{ matrix.platform }}
          #https://github.com/multiarch/qemu-user-static/issues/128
          push: false
  test-ibm-j9:
    needs:
      - smoke-test
    runs-on: ubuntu-26.04
    name: Test JDK IBM J9 1.8, ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Pull IBM JDK J9 1.8 Docker Image
        uses: addnab/docker-run-action@v3
        with:
          image: ibmjava:8-sdk-alpine
          options: -v ${{ github.workspace }}:/work
          run: |
            mkdir /work/ibmjdk
            cp -R /opt/ibm/java/* /work/ibmjdk
      - name: Set Java Version
        run: |
          export JAVA_HOME=${{ github.workspace }}/ibmjdk
          echo "JAVA_HOME=${{ github.workspace }}/ibmjdk" >> "$GITHUB_ENV"
          ${JAVA_HOME}/bin/java -version
        shell: bash
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.8.6
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '.github/workflows/pr.yml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Resolve dependencies
        run: mvn de.qaware.maven:go-offline-maven-plugin:resolve-dependencies -U -P ci || mvn de.qaware.maven:go-offline-maven-plugin:resolve-dependencies -U -P ci
      - name: Maven Version
        run: mvn --version
      - name: Build with Maven
        run: mvn -T 1C -B verify --file pom.xml -U -P ci -Dgpg.skip=true -Dmaven.wagon.http.retryHandler.count=3
        # https://youtrack.jetbrains.com/issue/KT-43894
        env:
          MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.showThreadName=true -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.showThreadName=true -Xmx1024m -Didea.home.path=${{ env.RUNNER_TEMP }} -Didea.ignore.disabled.plugins=true"
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: backend
  test-matrix:
    needs:
      - smoke-test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        # test against LTS versions of JDK up to 21:
#        java: [ 8, 11, 17, 21 ]
        java: [ 8, 11, 17, 21, 25 ]
        os: [ ubuntu-26.04, windows-2025, macos-26, macos-26-intel ]
        exclude:
          - java: 8
            os: ubuntu-26.04
          - java: 11
            os: windows-2025
          - java: 17
            os: macos-26
          - java: 25
            os: ubuntu-26.04
          - java: 8
            os: macos-26
          - java: 11
            os: macos-26
    name: Test JDK ${{ matrix.java }}, ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.8.6
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '.github/workflows/pr.yml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Resolve dependencies
        run: mvn de.qaware.maven:go-offline-maven-plugin:resolve-dependencies -U -P ci || mvn de.qaware.maven:go-offline-maven-plugin:resolve-dependencies -U -P ci
        if: matrix.os != 'windows-2025'
      - name: Resolve dependencies
        shell: cmd
        run: .\mvnretry.bat de.qaware.maven:go-offline-maven-plugin:resolve-dependencies -U -P ci
        if: matrix.os == 'windows-2025'
      - name: Build with Maven
        run: mvn -T 1C -B verify --file pom.xml -U -P ci -Dgpg.skip=true -Dmaven.wagon.http.retryHandler.count=3
        if: matrix.os != 'windows-2025'
        # https://youtrack.jetbrains.com/issue/KT-43894
        env:
          MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.showThreadName=true -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.showThreadName=true -Xmx1024m -Didea.home.path=${{ env.RUNNER_TEMP }} -Didea.ignore.disabled.plugins=true"
      - name: Build with Maven
        run: mvn -T 1C -B verify --file pom.xml -U -P ci '-Dgpg.skip=true' '-Dmaven.wagon.http.retryHandler.count=3'
        if: matrix.os == 'windows-2025'
        # https://youtrack.jetbrains.com/issue/KT-43894
        env:
          MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.showThreadName=true -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.showThreadName=true -Xmx1024m -Didea.home.path=${{ env.RUNNER_TEMP }} -Didea.ignore.disabled.plugins=true"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: surefire-test-report-test-matrix-${{ matrix.java }}-${{ matrix.os }}
          path: |
            **/target/surefire-reports/
            **/target/surefire-reports/*.dump
            **/target/surefire-reports/*.dumpstream
            **/target/surefire-reports-provider-lifecycle/
            **/target/surefire-reports-provider-lifecycle/*.dump
            **/target/surefire-reports-provider-lifecycle/*.dumpstream
            **/target/hs_err*.*
            **/target/*jstack*.txt
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: backend
  analyze:
    needs:
      - smoke-test
    name: Analyze
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Set up JDK 17 for the complete legacy and modern reactor
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.8.6
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '.github/workflows/pr.yml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Resolve dependencies
        run: mvn de.qaware.maven:go-offline-maven-plugin:resolve-dependencies -U -P ci || mvn de.qaware.maven:go-offline-maven-plugin:resolve-dependencies -U -P ci
      - name: Build with Maven
        run: mvn -T 1C -B clean install --file pom.xml -U -P ci -Dgpg.skip=true -Dmaven.wagon.http.retryHandler.count=3
        # https://youtrack.jetbrains.com/issue/KT-43894
        env:
          MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.showThreadName=true -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.showThreadName=true -Xmx1024m -Didea.home.path=${{ env.RUNNER_TEMP }} -Didea.ignore.disabled.plugins=true"
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
