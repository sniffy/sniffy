name: AI delivery status

on:
  pull_request:
    paths:
      - .chatgpt/scheduled-task-prompt.md
      - .chatgpt/status-snapshot-instructions.md
      - .github/scripts/delivery-status.js
      - .github/scripts/delivery-status.test.js
      - .github/scripts/delivery-status-policy.test.js
      - .github/scripts/delivery-status-checkout-policy.test.js
      - .github/scripts/delivery-status-runner-policy.test.js
      - .github/scripts/delivery-status-mergeability.js
      - .github/scripts/delivery-status-mergeability.test.js
      - .github/workflows/delivery-status.yml
      - docs/ai-delivery/README.md
      - docs/ai-delivery/profile.yml
      - docs/ai-delivery/status-snapshot.md
      - docs/ai-delivery/status-workflow-optimization.md
      - docs/ai-delivery/ubuntu-slim-capability-experiment.md
      - docs/ai-delivery/merge-conflict-reconciliation.md
  issue_comment:
    types: [created]
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            .chatgpt/scheduled-task-prompt.md
            .chatgpt/status-snapshot-instructions.md
            .github/scripts/delivery-status.js
            .github/scripts/delivery-status.test.js
            .github/scripts/delivery-status-policy.test.js
            .github/scripts/delivery-status-checkout-policy.test.js
            .github/scripts/delivery-status-runner-policy.test.js
            .github/scripts/delivery-status-mergeability.js
            .github/scripts/delivery-status-mergeability.test.js
            .github/workflows/delivery-status.yml
            docs/ai-delivery/README.md
            docs/ai-delivery/profile.yml
            docs/ai-delivery/status-snapshot.md
            docs/ai-delivery/status-workflow-optimization.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - name: Check and test delivery status
        run: |
          node --check .github/scripts/delivery-status.js
          node --check .github/scripts/delivery-status.test.js
          node --check .github/scripts/delivery-status-policy.test.js
          node --check .github/scripts/delivery-status-checkout-policy.test.js
          node --check .github/scripts/delivery-status-runner-policy.test.js
          node --check .github/scripts/delivery-status-mergeability.js
          node --check .github/scripts/delivery-status-mergeability.test.js
          node --test \
            .github/scripts/delivery-status.test.js \
            .github/scripts/delivery-status-policy.test.js \
            .github/scripts/delivery-status-checkout-policy.test.js \
            .github/scripts/delivery-status-runner-policy.test.js \
            .github/scripts/delivery-status-mergeability.test.js
      - name: Parse workflow and profile YAML
        run: >-
          ruby -e 'require "yaml";
          YAML.load_file(".github/workflows/delivery-status.yml");
          YAML.load_file("docs/ai-delivery/profile.yml")'
      - name: Lint GitHub Actions workflow
        # actionlint 1.7.12 predates GitHub's queue concurrency key. Keep every other diagnostic active.
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
          -ignore 'unexpected key "queue" for "concurrency" section'
          .github/workflows/delivery-status.yml

  publish:
    if: >-
      github.event_name != 'pull_request' &&
      (
        github.event_name != 'issue_comment' ||
        (
          github.event.issue.pull_request == null &&
          contains(github.event.issue.labels.*.name, 'ai-delivery-status') &&
          github.event.comment.body == '/ai-delivery-status refresh' &&
          contains(fromJSON('["bedrin","bedrin-gpt"]'), github.actor)
        )
      )
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    concurrency:
      group: ai-delivery-status-${{ github.repository }}
      queue: max
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/delivery-status.js
            .github/scripts/delivery-status-mergeability.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Export Project fields and items
        id: export
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPOSITORY_TOKEN: ${{ github.token }}
          PROJECT_OWNER: sniffy
          PROJECT_NUMBER: '2'
          STATUS_REPOSITORY: sniffy/sniffy
          REFRESH_REQUEST_COMMENT_ID: ${{ github.event.comment.id || '' }}
          REFRESH_REQUEST_ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          REFRESH_REQUEST_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          mkdir -p status-artifact
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          source_sha="$(git rev-parse HEAD)"

          GH_TOKEN="$PROJECT_TOKEN" gh project field-list "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" \
            --limit 1000 \
            --format json \
            > status-artifact/project-fields.raw.json

          GH_TOKEN="$PROJECT_TOKEN" gh project item-list "$PROJECT_NUMBER" \
            --owner "$PROJECT_OWNER" \
            --limit 1000 \
            --format json \
            > status-artifact/project-items.raw.json

          GH_TOKEN="$REPOSITORY_TOKEN" gh issue list \
            --repo "$STATUS_REPOSITORY" \
            --state all \
            --limit 1000 \
            --json number,state,stateReason,title,url,author,labels,createdAt,updatedAt,closedAt \
            > status-artifact/repository-issues.raw.json

          GH_TOKEN="$REPOSITORY_TOKEN" gh pr list \
            --repo "$STATUS_REPOSITORY" \
            --state all \
            --limit 1000 \
            --json number,state,isDraft,mergedAt,closedAt,createdAt,updatedAt,title,url,author,labels,headRefName,headRefOid,baseRefName,isCrossRepository,mergeable,mergeStateStatus \
            > status-artifact/repository-pull-requests.raw.json

          status_owner="${STATUS_REPOSITORY%%/*}"
          status_name="${STATUS_REPOSITORY#*/}"
          # GraphQL pagination requires the literal $endCursor variable.
          # shellcheck disable=SC2016
          GH_TOKEN="$REPOSITORY_TOKEN" gh api graphql --paginate \
            -f owner="$status_owner" \
            -f name="$status_name" \
            -f query='query($owner: String!, $name: String!, $endCursor: String) {
              repository(owner: $owner, name: $name) {
                pullRequests(first: 100, after: $endCursor, states: OPEN) {
                  nodes {
                    number
                    closingIssuesReferences(first: 100) { totalCount nodes { number } }
                  }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }' \
            | jq -sc '[.[].data.repository.pullRequests.nodes[] | {number, closingIssuesReferences}]' \
            > "$RUNNER_TEMP/repository-pull-request-closing-issues.raw.json"

          node .github/scripts/delivery-status.js normalize \
            --fields status-artifact/project-fields.raw.json \
            --items status-artifact/project-items.raw.json \
            --issues status-artifact/repository-issues.raw.json \
            --pull-requests status-artifact/repository-pull-requests.raw.json \
            --output status-artifact/project-2-status.json \
            --generated-at "$generated_at" \
            --repository "$STATUS_REPOSITORY" \
            --project-owner "$PROJECT_OWNER" \
            --project-number "$PROJECT_NUMBER" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --head-sha "$source_sha" \
            --request-comment-id "$REFRESH_REQUEST_COMMENT_ID" \
            --request-issue-number "$REFRESH_REQUEST_ISSUE_NUMBER" \
            --request-actor "$REFRESH_REQUEST_ACTOR"

          node .github/scripts/delivery-status-mergeability.js \
            status-artifact/project-2-status.json \
            status-artifact/repository-pull-requests.raw.json \
            "$RUNNER_TEMP/repository-pull-request-closing-issues.raw.json"

          {
            echo "generated_at=$generated_at"
            echo "source_sha=$source_sha"
            echo "counts_json=$(jq -c '.counts' status-artifact/project-2-status.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Project status artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ai-delivery-status-project-2
          path: status-artifact/
          if-no-files-found: error
          retention-days: 2

      - name: Publish latest artifact pointer
        uses: actions/github-script@v9
        env:
          GENERATED_AT: ${{ steps.export.outputs.generated_at }}
          COUNTS_JSON: ${{ steps.export.outputs.counts_json }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          SOURCE_SHA: ${{ steps.export.outputs.source_sha }}
          REFRESH_REQUEST_COMMENT_ID: ${{ github.event.comment.id || '' }}
          REFRESH_REQUEST_ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          REFRESH_REQUEST_ACTOR: ${{ github.actor }}
        with:
          github-token: ${{ github.token }}
          script: |
            const status = require('./.github/scripts/delivery-status.js');
            const workflowRun = {
              id: Number(process.env.GITHUB_RUN_ID),
              attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              event: process.env.GITHUB_EVENT_NAME,
              upstreamRunId: null,
              headSha: process.env.SOURCE_SHA,
              refreshRequest: process.env.REFRESH_REQUEST_COMMENT_ID ? {
                commentId: Number(process.env.REFRESH_REQUEST_COMMENT_ID),
                issueNumber: Number(process.env.REFRESH_REQUEST_ISSUE_NUMBER),
                actor: process.env.REFRESH_REQUEST_ACTOR
              } : null
            };
            const payload = status.pointerPayload({
              generatedAt: process.env.GENERATED_AT,
              repository: 'sniffy/sniffy',
              projectOwner: 'sniffy',
              projectNumber: 2,
              workflowRun,
              artifact: {
                id: process.env.ARTIFACT_ID,
                name: 'ai-delivery-status-project-2',
                url: process.env.ARTIFACT_URL,
                digest: process.env.ARTIFACT_DIGEST,
                snapshotFile: 'project-2-status.json',
                rawFieldsFile: 'project-fields.raw.json',
                rawItemsFile: 'project-items.raw.json',
                rawIssuesFile: 'repository-issues.raw.json',
                rawPullRequestsFile: 'repository-pull-requests.raw.json',
                retentionDays: 2
              },
              counts: JSON.parse(process.env.COUNTS_JSON)
            });
            await status.publishStatusPointer({github, context, core, payload});

      - name: Acknowledge successful refresh request
        if: success() && github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.reactions.createForIssueComment({
              ...context.repo,
              comment_id: context.payload.comment.id,
              content: '+1'
            });

      - name: Reject failed refresh request
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const reactions = await github.paginate(github.rest.reactions.listForIssueComment, {
              ...context.repo,
              comment_id: context.payload.comment.id,
              per_page: 100
            });
            if (!reactions.some(reaction => reaction.content === '+1')) {
              await github.rest.reactions.createForIssueComment({
                ...context.repo,
                comment_id: context.payload.comment.id,
                content: '-1'
              });
            }
