name: AI delivery control

on:
  pull_request:
    paths:
      - .chatgpt/scheduled-task-prompt.md
      - .codex/local/scheduled-task-prompt.md
      - .codex/local/worker-task-prompt.md
      - .github/scripts/delivery-control.js
      - .github/scripts/delivery-control.test.js
      - .github/scripts/delivery-control-post-mutation.test.js
      - .github/scripts/delivery-policy.test.js
      - .github/workflows/delivery-control.yml
      - docs/ai-delivery/**
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      command:
        description: Guarded delivery-control/v1 JSON command
        required: true
        type: string

permissions: {}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - name: Check and test delivery control
        run: |
          node --check .github/scripts/delivery-control.js
          node --check .github/scripts/delivery-control.test.js
          node --check .github/scripts/delivery-control-post-mutation.test.js
          node --check .github/scripts/delivery-policy.test.js
          node --test .github/scripts/delivery-control.test.js .github/scripts/delivery-control-post-mutation.test.js .github/scripts/delivery-policy.test.js
      - name: Parse workflow and profile YAML
        run: >-
          ruby -e 'require "yaml";
          YAML.load_file(".github/workflows/delivery-control.yml");
          YAML.load_file("docs/ai-delivery/profile.yml")'

  parse:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        github.event.issue.state == 'open' &&
        contains(github.event.issue.labels.*.name, 'ai-delivery-control')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      payload_base64: ${{ steps.parse.outputs.payload_base64 }}
      target_repository: ${{ steps.parse.outputs.target_repository }}
      target_number: ${{ steps.parse.outputs.target_number }}
      control_comment_id: ${{ steps.parse.outputs.control_comment_id }}

    steps:
      - uses: actions/checkout@v7

      - name: Parse and authorize command
        id: parse
        uses: actions/github-script@v9
        env:
          AI_DELIVERY_COMMAND_ACTORS: ${{ vars.AI_DELIVERY_COMMAND_ACTORS }}
          PRODUCT_MANAGER_LOGIN: ${{ vars.PRODUCT_MANAGER_LOGIN }}
          DISPATCH_COMMAND: ${{ inputs.command }}
        with:
          github-token: ${{ github.token }}
          script: |
            const control = require('./.github/scripts/delivery-control.js');
            control.parseInvocation({
              context,
              core,
              dispatchCommand: process.env.DISPATCH_COMMAND,
              environment: process.env
            });
            await core.summary.write();

  transition:
    needs: parse
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.parse.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: >-
        ai-delivery-${{ needs.parse.outputs.target_repository || 'invalid' }}-${{ needs.parse.outputs.target_number || github.event.comment.id || github.run_id }}
      cancel-in-progress: false

    steps:
      - name: Reject invalid control command
        if: github.event_name == 'issue_comment' && needs.parse.result == 'failure'
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '-1'
            });

      - name: Fail invalid control command
        if: needs.parse.result == 'failure'
        run: |
          echo 'The delivery-control command failed parsing or authorization.' >&2
          exit 1

      - uses: actions/checkout@v7
        if: needs.parse.result == 'success'

      - name: Apply guarded ProjectV2 transition
        if: needs.parse.result == 'success'
        id: transition
        uses: actions/github-script@v9
        env:
          PAYLOAD_BASE64: ${{ needs.parse.outputs.payload_base64 }}
          REPOSITORY_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const actionsGithub = require('@actions/github');
            const control = require('./.github/scripts/delivery-control.js');
            const repositoryGithub = actionsGithub.getOctokit(process.env.REPOSITORY_TOKEN);
            await control.executeTransition({
              github,
              repositoryGithub,
              core,
              payloadBase64: process.env.PAYLOAD_BASE64
            });

      - name: Acknowledge control command
        if: >-
          always() &&
          needs.parse.result == 'success' &&
          needs.parse.outputs.control_comment_id != ''
        uses: actions/github-script@v9
        env:
          CONTROL_COMMENT_ID: ${{ needs.parse.outputs.control_comment_id }}
          OUTCOME: ${{ steps.transition.outputs.outcome }}
        with:
          github-token: ${{ github.token }}
          script: |
            const reaction = process.env.OUTCOME === 'success'
              ? '+1'
              : process.env.OUTCOME === 'conflict'
                ? 'confused'
                : '-1';
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number(process.env.CONTROL_COMMENT_ID),
              content: reaction
            });
