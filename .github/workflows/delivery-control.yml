name: AI delivery control

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      command:
        description: Guarded delivery-control/v1 JSON command
        required: true
        type: string

permissions: {}

jobs:
  parse:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        github.event.issue.state == 'open' &&
        contains(github.event.issue.body, '<!-- sniffy-ai-delivery-control -->')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      payload_base64: ${{ steps.parse.outputs.payload_base64 }}
      target_repository: ${{ steps.parse.outputs.target_repository }}
      target_number: ${{ steps.parse.outputs.target_number }}
      control_comment_id: ${{ steps.parse.outputs.control_comment_id }}

    steps:
      - uses: actions/checkout@v7

      - name: Parse and authorize command
        id: parse
        uses: actions/github-script@v9
        env:
          AI_DELIVERY_COMMAND_ACTORS: ${{ vars.AI_DELIVERY_COMMAND_ACTORS }}
          PRODUCT_MANAGER_LOGIN: ${{ vars.PRODUCT_MANAGER_LOGIN }}
          DISPATCH_COMMAND: ${{ inputs.command }}
        with:
          github-token: ${{ github.token }}
          script: |
            const control = require('./.github/scripts/delivery-control.js');
            control.parseInvocation({
              context,
              core,
              dispatchCommand: process.env.DISPATCH_COMMAND,
              environment: process.env
            });
            await core.summary.write();

  transition:
    needs: parse
    if: needs.parse.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    concurrency:
      group: >-
        ai-delivery-${{ needs.parse.outputs.target_repository }}-${{ needs.parse.outputs.target_number }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - name: Apply guarded ProjectV2 transition
        id: transition
        uses: actions/github-script@v9
        env:
          PAYLOAD_BASE64: ${{ needs.parse.outputs.payload_base64 }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const control = require('./.github/scripts/delivery-control.js');
            await control.executeTransition({
              github,
              core,
              payloadBase64: process.env.PAYLOAD_BASE64
            });

      - name: Acknowledge control command
        if: always() && needs.parse.outputs.control_comment_id != ''
        uses: actions/github-script@v9
        env:
          CONTROL_COMMENT_ID: ${{ needs.parse.outputs.control_comment_id }}
          OUTCOME: ${{ steps.transition.outputs.outcome }}
        with:
          github-token: ${{ github.token }}
          script: |
            const reaction = process.env.OUTCOME === 'success'
              ? '+1'
              : process.env.OUTCOME === 'conflict'
                ? 'confused'
                : '-1';
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number(process.env.CONTROL_COMMENT_ID),
              content: reaction
            });
