name: Validate website

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/website.yml"
      - "docs/frontend-development.md"
      - "docs/website-architecture.md"
      - "pom.xml"
      - "sniffy-ui/apps/site/**"
      - "sniffy-ui/packages/theme/**"
      - "sniffy-ui/packages/ui/package.json"
      - "sniffy-ui/package.json"
      - "sniffy-ui/package-lock.json"
      - "sniffy-ui/tsconfig.json"
      - "sniffy-ui/tsconfig.base.json"
      - "sniffy-ui/vitest.config.ts"
      - "sniffy-ui/eslint.config.js"
      - "sniffy-ui/.prettierignore"
      - "sniffy-ui/.prettierrc.json"
      - "sniffy-documentation/src/main/asciidoc/**"
      - "sniffy-core/src/test/java/io/sniffy/CoreApiExampleTest.java"
      - "sniffy-core/src/test/java/io/sniffy/socket/CaptureTrafficOverviewTest.java"
      - "sniffy/src/jboss-module/module.xml"
      - "sniffy-test/sniffy-junit/src/test/java/io/sniffy/test/junit/usage/DisableConnectivityOverviewTest.java"
      - "sniffy-test/sniffy-junit/src/test/java/io/sniffy/test/junit/usage/JUnitOverviewTest.java"
      - "sniffy-test/sniffy-junit/src/test/java/io/sniffy/test/junit/usage/JUnitUsageTest.java"
      - "sniffy-test/sniffy-kotest/src/test/kotlin/io/sniffy/test/kotest/usage/KotestUsageTests.kt"
      - "sniffy-test/sniffy-test-common/src/test/java/io/sniffy/test/SharedConnectionDataSourceTest.java"
      - "sniffy-test/sniffy-spring-test/src/test/java/io/sniffy/test/spring/usage/SpringSharedConnectionUsageTest.java"
      - "sniffy-test/sniffy-spring-test/src/test/java/io/sniffy/test/spring/usage/SpringUsageTest.java"
      - "sniffy-test/sniffy-testng/src/test/java/io/sniffy/test/testng/usage/UsageTestNg.java"
      - "sniffy-integration-tests/sniffy-integration-tests-spock/src/test/groovy/io/sniffy/test/spock/usage/SpockUsageSpec.groovy"
  pull_request:
    paths:
      - ".github/workflows/website.yml"
      - "docs/frontend-development.md"
      - "docs/website-architecture.md"
      - "pom.xml"
      - "sniffy-ui/apps/site/**"
      - "sniffy-ui/packages/theme/**"
      - "sniffy-ui/packages/ui/package.json"
      - "sniffy-ui/package.json"
      - "sniffy-ui/package-lock.json"
      - "sniffy-ui/tsconfig.json"
      - "sniffy-ui/tsconfig.base.json"
      - "sniffy-ui/vitest.config.ts"
      - "sniffy-ui/eslint.config.js"
      - "sniffy-ui/.prettierignore"
      - "sniffy-ui/.prettierrc.json"
      - "sniffy-documentation/src/main/asciidoc/**"
      - "sniffy-core/src/test/java/io/sniffy/CoreApiExampleTest.java"
      - "sniffy-core/src/test/java/io/sniffy/socket/CaptureTrafficOverviewTest.java"
      - "sniffy/src/jboss-module/module.xml"
      - "sniffy-test/sniffy-junit/src/test/java/io/sniffy/test/junit/usage/DisableConnectivityOverviewTest.java"
      - "sniffy-test/sniffy-junit/src/test/java/io/sniffy/test/junit/usage/JUnitOverviewTest.java"
      - "sniffy-test/sniffy-junit/src/test/java/io/sniffy/test/junit/usage/JUnitUsageTest.java"
      - "sniffy-test/sniffy-kotest/src/test/kotlin/io/sniffy/test/kotest/usage/KotestUsageTests.kt"
      - "sniffy-test/sniffy-test-common/src/test/java/io/sniffy/test/SharedConnectionDataSourceTest.java"
      - "sniffy-test/sniffy-spring-test/src/test/java/io/sniffy/test/spring/usage/SpringSharedConnectionUsageTest.java"
      - "sniffy-test/sniffy-spring-test/src/test/java/io/sniffy/test/spring/usage/SpringUsageTest.java"
      - "sniffy-test/sniffy-testng/src/test/java/io/sniffy/test/testng/usage/UsageTestNg.java"
      - "sniffy-integration-tests/sniffy-integration-tests-spock/src/test/groovy/io/sniffy/test/spock/usage/SpockUsageSpec.groovy"

permissions:
  contents: read

jobs:
  website:
    name: Website
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HOME: /root
      PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright
    container:
      image: node:24-bookworm-slim@sha256:cb4e8f7c443347358b7875e717c29e27bf9befc8f5a26cf18af3c3dec80e58c5
    defaults:
      run:
        working-directory: sniffy-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: sniffy-ui/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint website sources
        run: npx eslint apps/site packages/theme

      - name: Check website formatting
        run: >-
          npx prettier --check
          ../.github/workflows/website.yml
          ../docs/frontend-development.md
          apps/site
          packages/theme
          package.json
          package-lock.json
          tsconfig.json
          tsconfig.base.json
          vitest.config.ts
          eslint.config.js

      - name: Typecheck frontend workspace
        run: npm run typecheck

      - name: Test website contracts
        run: >-
          npx vitest run --project unit
          apps/site/src/site.test.ts
          apps/site/src/source-snippets.test.ts
          apps/site/src/product-version.test.ts
          apps/site/src/documentation.test.ts
          packages/theme/src/theme.test.ts

      - name: Build website with broken link and image validation
        run: npm run build:site

      - name: Test desktop and mobile website navigation
        run: npm test --workspace @sniffy/site

      - name: Upload complete static website
        uses: actions/upload-artifact@v7
        with:
          name: sniffy-website-${{ github.sha }}
          path: sniffy-ui/apps/site/build/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
