coverage:
  status:
    project:
      default: off
      backend:
        target: auto
        threshold: 1%
        if_not_found: failure
        # The base commit predates flagged uploads. Remove after develop has
        # received its first backend and frontend reports.
        informational: true
        flags:
          - backend
      frontend:
        target: auto
        threshold: 1%
        if_not_found: failure
        # Keep both project statuses visible while bootstrapping the baseline.
        informational: true
        flags:
          - frontend
    patch:
      default: off
      backend:
        target: auto
        threshold: 1%
        if_not_found: failure
        flags:
          - backend
      frontend:
        target: auto
        threshold: 1%
        if_not_found: failure
        flags:
          - frontend

flags:
  backend:
    carryforward: false
  frontend:
    carryforward: false
